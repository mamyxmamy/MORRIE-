<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MORRIEを探して ─ 営業部・期末の惨劇 ─</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #080a0f;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 10px;
    font-size: 14px;
  }
  header {
    text-align: center;
    padding: 10px 0;
    border-bottom: 1px solid #1e293b;
    margin-bottom: 10px;
  }
  h1 { font-size: 1.2rem; color: #ff4757; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255,71,87,0.4); }
  .status-bar { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }

  /* タイトル画面用オーバーレイ */
  #titleScreen {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #080a0f;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 20px;
    text-align: center;
  }
  #titleScreen h2 {
    font-size: 1.8rem;
    color: #ff4757;
    margin-bottom: 10px;
    letter-spacing: 2px;
    text-shadow: 0 0 15px rgba(255,71,87,0.6);
  }
  #titleScreen p {
    color: #94a3b8;
    font-size: 0.85rem;
    margin-bottom: 30px;
    line-height: 1.6;
  }
  .start-btn {
    background: #ff4757 !important;
    color: #fff !important;
    font-size: 1.1rem !important;
    padding: 15px 30px !important;
    border-radius: 6px !important;
    box-shadow: 0 0 15px rgba(255,71,87,0.4);
    border: none;
    cursor: pointer;
    font-weight: bold;
  }

  /* キャラクターカード一覧グリッド */
  .char-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .char-card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 6px;
    padding: 8px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .char-card.dead {
    opacity: 0.35;
    background: #030712;
    border-color: #111827;
  }
  .char-name { font-weight: bold; font-size: 0.95rem; color: #f8fafc; }
  .char-sub { font-size: 0.75rem; color: #64748b; margin-bottom: 6px; }
  
  .trust-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
  }
  .trust-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .dot-high { background-color: #2ed573; box-shadow: 0 0 6px #2ed573; }
  .dot-mid { background-color: #ffa502; box-shadow: 0 0 6px #ffa502; }
  .dot-low { background-color: #ff4757; box-shadow: 0 0 6px #ff4757; }
  .dot-player { background-color: #38bdf8; }
  .dot-dead { background-color: #475569; }

  /* ログボックス */
  .log-box {
    background: #030712;
    border: 1px solid #1e293b;
    border-radius: 6px;
    height: 160px;
    overflow-y: auto;
    padding: 8px;
    margin-bottom: 10px;
    font-size: 0.85rem;
    line-height: 1.4;
  }
  .log-box p { margin-bottom: 4px; }
  .sys { color: #ff4757; } 
  .doubt { color: #ff7f50; } 
  .cover { color: #2ed573; }

  /* 操作パネル */
  .action-panel {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 6px;
    padding: 10px;
  }
  #actionPrompt { font-size: 0.9rem; margin-bottom: 8px; color: #38bdf8; }
  .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  button {
    background: #1d4ed8;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 10px;
    font-size: 0.85rem;
    cursor: pointer;
    flex: 1 1 calc(50% - 6px);
    font-weight: bold;
  }
  button:active { background: #1e40af; }
  button:disabled { background: #374151; color: #6b7280; }
</style>
</head>
<body>

<!-- タイトル画面 -->
<div id="titleScreen">
  <h2>MORRIEを探して<br><span style="font-size: 1rem; color: #94a3b8;">─ 営業部・期末の惨劇 ─</span></h2>
  <p>期末が迫り、営業目標は絶望的に足りない。<br>ピリついた夜のオフィスで発覚した事実――。<br>この中に、社員の皮を被った怪物「MORRIE」が紛れ込んでいる。<br><br>疑いとノルマのプレッシャーの中、生き残れ。</p>
  <button class="start-btn" onclick="startGame()">緊急会議を始める</button>
</div>

<header>
  <h1>MORRIEを探して ─ 営業部</h1>
  <div class="status-bar" id="gameInfo">待機中</div>
</header>

<div class="char-grid" id="charGrid"></div>

<div class="log-box" id="logBox"></div>

<div class="action-panel" id="actionPanel">
  <div id="actionPrompt">会議の開始を待っています...</div>
  <div class="btn-group" id="actionButtons"></div>
</div>

<script>
const chars = [
  { id: 0, name: "あなた", isPlayer: true, isAlive: true, logic: 8, charisma: 8, charm: 5, stealth: 5, aggro: 5 },
  { id: 1, name: "横山", isPlayer: false, isAlive: true, logic: 8, charisma: 5, charm: 5, stealth: 6, aggro: 5 },
  { id: 2, name: "赤堀", isPlayer: false, isAlive: true, logic: 6, charisma: 6, charm: 8, stealth: 8, aggro: 2 },
  { id: 3, name: "北野", isPlayer: false, isAlive: true, logic: 3, charisma: 2, charm: 5, stealth: 10, aggro: 1 },
  { id: 4, name: "毛利", isPlayer: false, isAlive: true, logic: 2, charisma: 9, charm: 7, stealth: 4, aggro: 8 },
  { id: 5, name: "内藤", isPlayer: false, isAlive: true, logic: 5, charisma: 3, charm: 1, stealth: 5, aggro: 7 },
  { id: 6, name: "山口", isPlayer: false, isAlive: true, logic: 9, charisma: 8, charm: 3, stealth: 2, aggro: 9 }
];

let day = 1;
let discussionTurn = 0;
const MAX_TURNS = 3;
let morrieId = -1;
let trust = {};

function startGame() {
  document.getElementById("titleScreen").style.display = "none";

  const npcs = chars.filter(c => !c.isPlayer);
  morrieId = npcs[Math.floor(Math.random() * npcs.length)].id;
  
  chars.forEach(c1 => {
    trust[c1.id] = {};
    chars.forEach(c2 => { trust[c1.id][c2.id] = 50; });
  });

  addLog("期末の夜。オフィスに閉じ込められた営業部員の中に、MORRIEが潜んでいる...", "sys");
  updateUI();
  showDiscussionUI();
}

function updateUI() {
  document.getElementById("gameInfo").innerText = `期末 ${day}日目 - ${discussionTurn < MAX_TURNS ? `会議 (${discussionTurn + 1}/${MAX_TURNS})` : "隔離投票"}`;
  
  const grid = document.getElementById("charGrid");
  grid.innerHTML = "";

  chars.forEach(c => {
    const card = document.createElement("div");
    card.className = `char-card ${!c.isAlive ? "dead" : ""}`;
    
    let indicatorHtml = "";
    if (c.isPlayer) {
      indicatorHtml = `<div class="trust-indicator"><div class="trust-dot dot-player"></div><span>プレイヤー</span></div>`;
    } else if (!c.isAlive) {
      indicatorHtml = `<div class="trust-indicator"><div class="trust-dot dot-dead"></div><span>隔離・退室</span></div>`;
    } else {
      const tVal = trust[0][c.id];
      let dotClass = "dot-mid";
      let statusText = "中立・様子見";
      if (tVal >= 65) { dotClass = "dot-high"; statusText = "信頼"; }
      else if (tVal <= 35) { dotClass = "dot-low"; statusText = "要警戒（怪しい）"; }
      
      indicatorHtml = `<div class="trust-indicator"><div class="trust-dot ${dotClass}"></div><span>${statusText}</span></div>`;
    }

    card.innerHTML = `
      <div>
        <div class="char-name">${c.name}</div>
        <div class="char-sub">${c.isAlive ? "社内生存" : "排除済み"}</div>
      </div>
      ${indicatorHtml}
    `;
    grid.appendChild(card);
  });
}

function addLog(text, type = "") {
  const box = document.getElementById("logBox");
  box.innerHTML += `<p class="${type}">${text}</p>`;
  box.scrollTop = box.scrollHeight;
}

function applyDoubt(speaker, target) {
  let damage = speaker.logic * 3 - target.charm * 1.5;
  if(damage < 0) damage = 0; 
  if(speaker.name === "毛利") damage = speaker.charisma * 2;

  chars.forEach(c => {
    if (c.isAlive) {
      trust[c.id][target.id] = Math.max(0, trust[c.id][target.id] - damage);
    }
  });
}

function applyCover(speaker, target) {
  let heal = speaker.charisma * 2;
  trust[speaker.id][target.id] = Math.min(100, trust[speaker.id][target.id] + heal);
  trust[target.id][speaker.id] = Math.min(100, trust[target.id][speaker.id] + heal);
}

function playerAction(targetId) {
  const target = chars.find(c => c.id === targetId);
  addLog(`あなた「${target.name}の数字の出し方、何か隠してないか？」`, "doubt");
  applyDoubt(chars[0], target);
  updateUI();
  runNpcTurn();
}

function runNpcTurn() {
  const aliveNpcs = chars.filter(c => c.isAlive && !c.isPlayer);
  const aliveCount = chars.filter(c => c.isAlive).length;
  const baselineTrust = (aliveCount - 1) * 50;
  
  aliveNpcs.forEach(npc => {
    let willSpeak = (Math.random() * 10 <= npc.aggro);
    let minGlobalTrust = 9999;
    let globalMostSuspected = null;
    
    chars.forEach(target => {
      if (target.isAlive) {
        let totalTrust = 0;
        chars.forEach(voter => {
          if (voter.isAlive && voter.id !== target.id) totalTrust += trust[voter.id][target.id];
        });
        if (totalTrust < minGlobalTrust) {
          minGlobalTrust = totalTrust;
          globalMostSuspected = target;
        }
      }
    });

    if (npc.name === "赤堀") {
      if (minGlobalTrust < baselineTrust && globalMostSuspected && globalMostSuspected.id !== npc.id) {
        addLog(`赤堀「落ち着いてよ、${globalMostSuspected.name}さんはノルマできつくなってるだけだよ」`, "cover");
        applyCover(npc, globalMostSuspected);
        return;
      }
      if (willSpeak) {
        const others = chars.filter(c => c.isAlive && c.id !== npc.id);
        const rTarget = others[Math.floor(Math.random() * others.length)];
        addLog(`赤堀「${rTarget.name}さんは今期すごく頑張ってると思うな」`, "cover");
        applyCover(npc, rTarget);
      }
      return;
    }

    if (!willSpeak) return;

    let myLowestTrust = 100;
    let myTargets = [];
    chars.forEach(c => {
      if (c.isAlive && c.id !== npc.id) {
        if (trust[npc.id][c.id] < myLowestTrust) {
          myLowestTrust = trust[npc.id][c.id];
          myTargets = [c];
        } else if (trust[npc.id][c.id] === myLowestTrust) {
          myTargets.push(c);
        }
      }
    });

    let target = myTargets[Math.floor(Math.random() * myTargets.length)];
    addLog(`${npc.name}「どう考えても ${target.name} の動きがおかしいだろ...！」`, "doubt");
    applyDoubt(npc, target);
  });

  discussionTurn++;
  updateUI();

  if (discussionTurn >= MAX_TURNS) {
    showVotingUI();
  } else {
    showDiscussionUI();
  }
}

function showDiscussionUI() {
  updateUI();
  const prompt = document.getElementById("actionPrompt");
  const buttons = document.getElementById("actionButtons");
  prompt.innerText = "誰を追求して矛盾を突きますか？";
  buttons.innerHTML = "";

  chars.filter(c => c.isAlive && !c.isPlayer).forEach(c => {
    const btn = document.createElement("button");
    btn.innerText = `${c.name}を追求`;
    btn.onclick = () => playerAction(c.id);
    buttons.appendChild(btn);
  });
}

function showVotingUI() {
  updateUI();
  addLog("--- 会議終了: 隔離（別室送りにする）メンバーを投票します ---", "sys");
  const prompt = document.getElementById("actionPrompt");
  const buttons = document.getElementById("actionButtons");
  prompt.innerText = "怪しいとして隔離するメンバーに投票してください:";
  buttons.innerHTML = "";

  chars.filter(c => c.isAlive && !c.isPlayer).forEach(c => {
    const btn = document.createElement("button");
    btn.innerText = `${c.name}に投票`;
    btn.onclick = () => processVote(c.id);
    buttons.appendChild(btn);
  });
}

function processVote(playerVoteId) {
  const votes = {};
  chars.forEach(c => { if(c.isAlive) votes[c.id] = 0; });
  votes[playerVoteId]++;

  chars.filter(c => c.isAlive && !c.isPlayer).forEach(npc => {
    let targetId = null; let minT = 101;
    chars.filter(other => other.isAlive && other.id !== npc.id).other.forEach ? ... : null; // 簡略化
    chars.filter(other => other.isAlive && other.id !== npc.id).forEach(other => {
      if (trust[npc.id][other.id] < minT) { minT = trust[npc.id][other.id]; targetId = other.id; }
    });
    if (targetId !== null) votes[targetId]++;
  });

  let maxVotes = -1; let expelledId = null;
  for (const [id, count] of Object.entries(votes)) {
    if (count > maxVotes) { maxVotes = count; expelledId = parseInt(id); }
  }

  const expelled = chars.find(c => c.id === expelledId);
  expelled.isAlive = false;
  addLog(`【投票結果】最多得票により、${expelled.name} が会議室から隔離（退室）させられた。`, "sys");

  updateUI();
  if (checkVictory()) return;
  runNightPhase();
}

function runNightPhase() {
  addLog("--- 深夜... 静まり返ったオフィスでMORRIEが動き出す ---", "sys");
  const morrie = chars.find(c => c.id === morrieId);
  
  if (morrie && morrie.isAlive) {
    const targets = chars.filter(c => c.isAlive && c.id !== morrieId && (!c.isPlayer || day > 1));
    let victim = null;

    if (morrie.stealth >= 8) {
      let minTrust = 100;
      targets.forEach(t => {
        if(trust[t.id][morrie.id] < minTrust) { minTrust = trust[t.id][morrie.id]; victim = t; }
      });
    } else if (morrie.logic >= 7) {
      targets.sort((a, b) => (b.logic + b.charisma) - (a.logic + a.charisma));
      victim = targets[0];
    } else {
      if (targets.length > 0) {
        victim = targets[Math.floor(Math.random() * targets.length)];
      }
    }

    if (victim) {
      victim.isAlive = false;
      addLog(`暗いフロアに冷たい音が響いた... ${victim.name} が消息を絶った。`, "sys");
    }
  }

  updateUI();

  const player = chars.find(c => c.isPlayer);
  if (!player.isAlive) {
    addLog("【GAME OVER】あなたはMORRIEに襲撃され、オフィスから姿を消した...", "sys");
    const prompt = document.getElementById("actionPrompt");
    const buttons = document.getElementById("actionButtons");
    prompt.innerText = "GAME OVER (脱落)";
    buttons.innerHTML = '<button onclick="location.reload()" style="flex:1 1 100%;">再挑戦する</button>';
    return;
  }

  if (checkVictory()) return;
  
  day++; discussionTurn = 0;
  addLog(`--- 期末 ${day}日目の朝 ---`, "sys");
  showDiscussionUI();
}

function checkVictory() {
  const isMorrieAlive = chars.find(c => c.id === morrieId).isAlive;
  const aliveHumans = chars.filter(c => c.isAlive && c.id !== morrieId).length;

  const prompt = document.getElementById("actionPrompt");
  const buttons = document.getElementById("actionButtons");

  if (!isMorrieAlive) {
    addLog("【営業部の勝利】MORRIEを会社から排除した！ノルマ達成へ向けて再始動だ。", "cover");
    prompt.innerText = "CLEAR - 営業目標達成への道";
    buttons.innerHTML = '<button onclick="location.reload()" style="flex:1 1 100%;">もう一度プレイ</button>';
    return true;
  }
  if (aliveHumans <= 1) {
    addLog("【MORRIEの勝利】社員は全員喰らい尽くされ、営業部は崩壊した...", "sys");
    prompt.innerText = "GAME OVER";
    buttons.innerHTML = '<button onclick="location.reload()" style="flex:1 1 100%;">再挑戦する</button>';
    return true;
  }
  return false;
}
</script>

</body>
</html>
