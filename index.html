<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MORRIEを探して - Prototype</title>
<style>
  body { background-color: #111; color: #eee; font-family: sans-serif; padding: 10px; font-size: 14px; }
  h1 { font-size: 1.2rem; color: #ff4757; text-align: center; }
  .status-bar { text-align: center; color: #aaa; margin-bottom: 10px; }
  .log-box { background: #222; border: 1px solid #444; height: 250px; overflow-y: auto; padding: 10px; margin-bottom: 15px; }
  .log-box p { margin: 5px 0; line-height: 1.4; }
  .sys { color: #ff4757; } .doubt { color: #ff7f50; } .cover { color: #2ed573; }
  .action-panel { background: #333; padding: 10px; border-radius: 5px; }
  button { background: #3742fa; color: white; border: none; padding: 8px 12px; margin: 3px; border-radius: 4px; cursor: pointer; }
  button:disabled { background: #555; }
</style>
</head>
<body>

<header>
  <h1>MORRIEを探して</h1>
  <div class="status-bar" id="gameInfo">Day 1 - 議論フェーズ</div>
</header>

<div class="log-box" id="logBox"></div>

<div class="action-panel" id="actionPanel">
  <div id="actionPrompt">誰を疑いますか？</div>
  <div id="actionButtons"></div>
</div>

<script>
// --- キャラクター定義 ---
// logic(論理), charisma(影響力), charm(かわいげ), stealth(隠密), aggro(攻撃性)
const chars = [
  { id: 0, name: "山口", isPlayer: true, isAlive: true, logic: 9, charisma: 8, charm: 3, stealth: 2, aggro: 9 },
  { id: 1, name: "横山", isPlayer: false, isAlive: true, logic: 8, charisma: 5, charm: 5, stealth: 6, aggro: 5 },
  { id: 2, name: "赤堀", isPlayer: false, isAlive: true, logic: 6, charisma: 6, charm: 8, stealth: 8, aggro: 2 },
  { id: 3, name: "北野", isPlayer: false, isAlive: true, logic: 3, charisma: 2, charm: 5, stealth: 10, aggro: 1 },
  { id: 4, name: "毛利", isPlayer: false, isAlive: true, logic: 2, charisma: 9, charm: 7, stealth: 4, aggro: 8 },
  { id: 5, name: "内藤", isPlayer: false, isAlive: true, logic: 5, charisma: 3, charm: 1, stealth: 5, aggro: 7 }
];

let day = 1;
let discussionTurn = 0;
const MAX_TURNS = 3;
let morrieId = -1;

// 好感度マトリクス (50が中立。高いほど信頼、低いほど疑い)
let trust = {};

function initGame() {
  // MORRIE(人狼)をランダムに決定 (プレイヤーがMORRIEになる機能は今後の拡張用として、今回はNPCから選出)
  const npcs = chars.filter(c => !c.isPlayer);
  morrieId = npcs[Math.floor(Math.random() * npcs.length)].id;
  
  chars.forEach(c1 => {
    trust[c1.id] = {};
    chars.forEach(c2 => { trust[c1.id][c2.id] = 50; });
  });

  addLog("ゲーム開始。この中にMORRIEが潜んでいる...", "sys");
  addLog("【デバッグ情報】今回のMORRIE宿主: " + chars.find(c => c.id === morrieId).name, "sys");
  showDiscussionUI();
}

function addLog(text, type = "") {
  const box = document.getElementById("logBox");
  box.innerHTML += `<p class="${type}">${text}</p>`;
  box.scrollTop = box.scrollHeight;
}

function updateInfo(text) {
  document.getElementById("gameInfo").innerText = text;
}

// --- 議論と好感度の計算 ---
// 疑う処理 (発言者のロジックと相手のかわいげでダメージが変動)
function applyDoubt(speaker, target) {
  let damage = speaker.logic * 3 - target.charm * 1.5;
  if(damage < 0) damage = 0; // かわいげが高すぎるとノーダメージ

  // 毛利の特殊処理 (ロジック無視、カリスマで強制ヘイト)
  if(speaker.name === "毛利") damage = speaker.charisma * 2;

  chars.forEach(c => {
    if (c.isAlive && c.id !== speaker.id) {
      trust[c.id][target.id] = Math.max(0, trust[c.id][target.id] - damage);
    }
  });
}

// かばう処理
function applyCover(speaker, target) {
  let heal = speaker.charisma * 2;
  trust[speaker.id][target.id] = Math.min(100, trust[speaker.id][target.id] + heal);
  trust[target.id][speaker.id] = Math.min(100, trust[target.id][speaker.id] + heal);
}

// --- プレイヤーの行動 ---
function playerAction(targetId) {
  const target = chars.find(c => c.id === targetId);
  addLog(`山口(あなた)「${target.name}の行動には矛盾がある」`, "doubt");
  applyDoubt(chars[0], target);
  
  runNpcTurn();
}

// --- NPCのAI行動 (性格パラメーター反映) ---
function runNpcTurn() {
  const aliveNpcs = chars.filter(c => c.isAlive && !c.isPlayer);
  
  aliveNpcs.forEach(npc => {
    // 攻撃性に基づいた行動確率 (攻撃性が低い北野などは発言をスキップしやすい)
    if (Math.random() * 10 > npc.aggro && npc.name !== "赤堀") return;

    // 一番疑われている人(ヘイトが一番高い人)を探す
    let lowestTrust = 100;
    let mostSuspected = null;
    chars.forEach(c => {
      if (c.isAlive && c.id !== npc.id && trust[npc.id][c.id] < lowestTrust) {
        lowestTrust = trust[npc.id][c.id];
        mostSuspected = c;
      }
    });

    if (!mostSuspected) return;

    // 【赤堀の特殊AI】腹黒中立：一番疑われている人をあえて「かばう」ことで好感度を稼ぐ
    if (npc.name === "赤堀") {
      addLog(`赤堀「待って、${mostSuspected.name}さんはそんな人じゃないと思う」`, "cover");
      applyCover(npc, mostSuspected);
    } else {
      addLog(`${npc.name}「${mostSuspected.name}が怪しい...！」`, "doubt");
      applyDoubt(npc, mostSuspected);
    }
  });

  discussionTurn++;
  if (discussionTurn >= MAX_TURNS) {
    showVotingUI();
  } else {
    updateInfo(`Day ${day} - 議論 (${discussionTurn}/${MAX_TURNS})`);
  }
}

// --- 議論UI ---
function showDiscussionUI() {
  updateInfo(`Day ${day} - 議論 (${discussionTurn}/${MAX_TURNS})`);
  const prompt = document.getElementById("actionPrompt");
  const buttons = document.getElementById("actionButtons");
  prompt.innerText = "誰を疑って論破しますか？";
  buttons.innerHTML = "";

  chars.filter(c => c.isAlive && !c.isPlayer).forEach(c => {
    const btn = document.createElement("button");
    btn.innerText = `${c.name}を論破`;
    btn.onclick = () => playerAction(c.id);
    buttons.appendChild(btn);
  });
}

// --- 投票フェーズ ---
function showVotingUI() {
  updateInfo(`Day ${day} - 投票`);
  addLog("--- 議論終了: 追放者を決定します ---", "sys");
  const prompt = document.getElementById("actionPrompt");
  const buttons = document.getElementById("actionButtons");
  prompt.innerText = "追放する相手に投票してください:";
  buttons.innerHTML = "";

  chars.filter(c => c.isAlive && !c.isPlayer).forEach(c => {
    const btn = document.createElement("button");
    btn.innerText = `${c.name}に投票`;
    btn.onclick = () => processVote(c.id);
    buttons.appendChild(btn);
  });
}

function processVote(playerVoteId) {
  const votes = {};
  chars.forEach(c => { if(c.isAlive) votes[c.id] = 0; });
  votes[playerVoteId]++;

  // NPCの投票 (一番信頼度が低い相手に投票)
  chars.filter(c => c.isAlive && !c.isPlayer).forEach(npc => {
    let targetId = null; let minT = 101;
    chars.filter(other => other.isAlive && other.id !== npc.id).forEach(other => {
      if (trust[npc.id][other.id] < minT) { minT = trust[npc.id][other.id]; targetId = other.id; }
    });
    if (targetId !== null) votes[targetId]++;
  });

  let maxVotes = -1; let expelledId = null;
  for (const [id, count] of Object.entries(votes)) {
    if (count > maxVotes) { maxVotes = count; expelledId = parseInt(id); }
  }

  const expelled = chars.find(c => c.id === expelledId);
  expelled.isAlive = false;
  addLog(`【投票結果】最多得票により、${expelled.name} が追放されました。`, "sys");

  if (checkVictory()) return;
  runNightPhase();
}

// --- 夜フェーズ (MORRIEの襲撃AI) ---
function runNightPhase() {
  addLog("--- 夜が訪れた... MORRIEが目を覚ます ---", "sys");
  const morrie = chars.find(c => c.id === morrieId);
  
  if (morrie && morrie.isAlive) {
    const targets = chars.filter(c => c.isAlive && c.id !== morrieId);
    let victim = null;

    // 【宿主のパラメーターに依存した襲撃先の決定】
    if (morrie.stealth >= 8) {
      // 北野などのステルス型：自分への好感度が一番低い(自分を疑っている)人物を消す
      let minTrust = 100;
      targets.forEach(t => {
        if(trust[t.id][morrie.id] < minTrust) { minTrust = trust[t.id][morrie.id]; victim = t; }
      });
    } else if (morrie.logic >= 7) {
      // 横山などのロジック型：一番カリスマまたはロジックが高い強敵を狙う
      targets.sort((a, b) => (b.logic + b.charisma) - (a.logic + a.charisma));
      victim = targets[0];
    } else {
      // 毛利・内藤など：ランダムに襲撃
      victim = targets[Math.floor(Math.random() * targets.length)];
    }

    if (victim) {
      victim.isAlive = false;
      addLog(`凄惨な悲鳴が響いた... ${victim.name} が犠牲になった。`, "sys");
    }
  }

  if (checkVictory()) return;
  day++; discussionTurn = 0;
  addLog(`--- Day ${day} ---`, "sys");
  showDiscussionUI();
}

function checkVictory() {
  const isMorrieAlive = chars.find(c => c.id === morrieId).isAlive;
  const aliveHumans = chars.filter(c => c.isAlive && c.id !== morrieId).length;

  const prompt = document.getElementById("actionPrompt");
  const buttons = document.getElementById("actionButtons");

  if (!isMorrieAlive) {
    addLog("【人間陣営の勝利】MORRIEを排除しました！", "cover");
    prompt.innerText = "GAME CLEAR";
    buttons.innerHTML = '<button onclick="location.reload()">再プレイ</button>';
    return true;
  }
  if (aliveHumans <= 1) {
    addLog("【MORRIEの勝利】生存者の数がMORRIEに並ばれました...", "sys");
    prompt.innerText = "GAME OVER";
    buttons.innerHTML = '<button onclick="location.reload()">再プレイ</button>';
    return true;
  }
  return false;
}

initGame();
</script>

</body>
</html>
